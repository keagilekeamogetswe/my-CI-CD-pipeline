name: Playwright

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Run root test service
        run: bash ./frontend.test.service.sh

      - name: Install frontend dependencies
        working-directory: frontend/swift/website
        run: npm install

      - name: Run frontend tests
        working-directory: frontend/swift/website
        run: npm test
