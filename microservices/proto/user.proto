syntax = "proto3";

package user;

// Service definition
service CredentialsService {
  rpc LogIn (UserCredentials) returns (RefreshTokenResponse);
}
message UserCredentials {
  string user_id = 1;
  string password = 2;
  string device_info = 3;
}
message RefreshTokenResponse {
  string refresh_token = 1;
  bool success = 2; // Change boolean to bool
  string message = 3;
}
