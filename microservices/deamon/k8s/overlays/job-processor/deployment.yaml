apiVersion: apps/v1
kind: Deployment
metadata:
  name: deamon
spec:
  selector:
    matchLabels:
      app: deamon
      role: job-processor
  template:
    metadata:
      labels:
        app: deamon
        role: job-processor
    spec:
      containers:
      - name: deamon #Container name must match the base container name so Kustomize merges the args into the existing container rather than creating a second container inside the Pod.
        args: ["npm", "run", "job-processor"]